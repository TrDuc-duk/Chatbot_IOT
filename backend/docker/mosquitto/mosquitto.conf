# ==========================================
# Mosquitto MQTT Broker Configuration
# ==========================================

# Listener cho MQTT protocol
listener 1883 0.0.0.0

# Listener cho WebSocket (cho web client nếu cần)
listener 9001
protocol websockets

# Cho phép kết nối không cần authentication (development only!)
# Production: Đổi thành false và cấu hình authentication
allow_anonymous true

# Persistence - Lưu messages và subscriptions
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Giữ lại messages khi client reconnect
# retain_available true