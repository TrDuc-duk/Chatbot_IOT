version: "3.8"

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: smart_garden_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_garden
    ports:
      - "5433:5432"
    volumes:
      # Lưu data persistent, không mất khi restart container
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Mosquitto MQTT Broker
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart_garden_mqtt
    restart: unless-stopped
    ports:
      # MQTT protocol port
      - "1883:1883"
      # WebSocket port (nếu cần kết nối từ browser)
      - "9001:9001"
    volumes:
      # Config file
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Data persistent
      - mosquitto_data:/mosquitto/data
      # Logs
      - mosquitto_logs:/mosquitto/log

  # ==========================================
  # MQTT Explorer (Optional - Tool để debug MQTT)
  # ==========================================
  # Uncomment nếu muốn dùng web UI để xem MQTT messages
  # mqtt-explorer:
  #   image:  smeagolworms4/mqtt-explorer
  #   container_name: smart_garden_mqtt_explorer
  #   ports:
  #     - "4000:4000"
  #   depends_on:
  #     - mosquitto

# ==========================================
# Volumes - Lưu trữ persistent
# ==========================================
volumes:
  postgres_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
